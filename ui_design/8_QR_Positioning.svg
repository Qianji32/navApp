<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Glow Filter for Laser -->
    <filter id="laser_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Laser Trail Gradient -->
    <linearGradient id="laser_trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glassmorphism Blur Filter -->
    <filter id="glass_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>

  <!-- Simulated Camera Feed Background (Dark/Cinematic for contrast) -->
  <rect width="390" height="844" fill="#0F172A" />
  
  <!-- Subtle 3D grid in background simulating AR recognition -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.3">
    <path d="M195 422 L0 0" />
    <path d="M195 422 L390 0" />
    <path d="M195 422 L0 844" />
    <path d="M195 422 L390 844" />
    <circle cx="195" cy="422" r="100" fill="none" />
    <circle cx="195" cy="422" r="200" fill="none" />
    <circle cx="195" cy="422" r="300" fill="none" />
  </g>

  <!-- Semi-Transparent Dark Overlay with Cutout -->
  <mask id="scanner_cutout">
    <rect width="390" height="844" fill="white" />
    <rect x="65" y="292" width="260" height="260" rx="32" fill="black" />
  </mask>
  <rect width="390" height="844" fill="#000000" opacity="0.6" mask="url(#scanner_cutout)" />

  <!-- Top App Bar (Glassmorphic) -->
  <rect x="0" y="0" width="390" height="110" fill="rgba(15, 23, 42, 0.4)" />
  <!-- Back Button -->
  <circle cx="44" cy="68" r="20" fill="rgba(255, 255, 255, 0.1)" />
  <path d="M48 60 L40 68 L48 76" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Title -->
  <text x="195" y="74" font-family="-apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="0.3">Initial Positioning</text>

  <!-- Instruction Badge -->
  <rect x="95" y="180" width="200" height="40" rx="20" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <circle cx="120" cy="200" r="4" fill="#3B82F6" />
  <text x="134" y="205" font-family="-apple-system, sans-serif" font-size="14" fill="#E2E8F0" font-weight="500">Scan accurate location</text>

  <!-- Scanner Frame (High-tech Blue Corners) -->
  <g stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none">
    <!-- Top Left -->
    <path d="M65 342 L65 324 Q65 292 97 292 L115 292" />
    <!-- Top Right -->
    <path d="M275 292 L293 292 Q325 292 325 324 L325 342" />
    <!-- Bottom Right -->
    <path d="M325 502 L325 520 Q325 552 293 552 L275 552" />
    <!-- Bottom Left -->
    <path d="M115 552 L97 552 Q65 552 65 520 L65 502" />
  </g>

  <!-- Animated Scanning Laser Line -->
  <rect x="65" y="440" width="260" height="3" fill="#60A5FA" filter="url(#laser_glow)" />
  <!-- Laser Trail -->
  <rect x="65" y="360" width="260" height="80" fill="url(#laser_trail)" />

  <!-- Simulated QR Code in Background (Slightly out of focus/dimmed) -->
  <g fill="rgba(255, 255, 255, 0.15)">
    <rect x="135" y="362" width="40" height="40" rx="8" />
    <rect x="143" y="370" width="24" height="24" rx="4" />
    
    <rect x="215" y="362" width="40" height="40" rx="8" />
    <rect x="223" y="370" width="24" height="24" rx="4" />
    
    <rect x="135" y="442" width="40" height="40" rx="8" />
    <rect x="143" y="450" width="24" height="24" rx="4" />

    <rect x="185" y="365" width="20" height="20" rx="4" />
    <rect x="235" y="442" width="20" height="20" rx="4" />
    <rect x="185" y="420" width="30" height="30" rx="4" />
  </g>

  <!-- Helper Text -->
  <text x="195" y="610" font-family="-apple-system, sans-serif" font-size="15" fill="#CBD5E1" text-anchor="middle" font-weight="500">Align QR code within the frame</text>
  <text x="195" y="632" font-family="-apple-system, sans-serif" font-size="14" fill="#64748B" text-anchor="middle" font-weight="400">Find locating codes on pillars or desks</text>

  <!-- Bottom Controls -->
  <!-- Flashlight Toggle -->
  <g transform="translate(100, 710)">
    <rect width="64" height="64" rx="32" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <path d="M32 20 L24 34 L30 34 L30 46 L40 30 L32 30 L35 20 Z" fill="#94A3B8" /> <!-- Lightning Icon -->
    <text x="32" y="86" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="500">Flashlight</text>
  </g>

  <!-- Photo Upload Toggle -->
  <g transform="translate(226, 710)">
    <rect width="64" height="64" rx="32" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <circle cx="32" cy="32" r="10" stroke="#94A3B8" stroke-width="2" fill="none" />
    <path d="M22 28 Q32 18 42 28" stroke="#94A3B8" stroke-width="2" fill="none" /> <!-- Minimal Gallery Icon -->
    <text x="32" y="86" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="500">From Photos</text>
  </g>

</svg>