<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F5FF"/>
      <stop offset="100%" stop-color="#F8FAFF"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="390" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="toggleOnGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#3B82F6" flood-opacity="0.08"/>
    </filter>
    <filter id="avatarShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1D4ED8" flood-opacity="0.35"/>
    </filter>
    <filter id="navShadow">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="premiumBadge" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
  </defs>

